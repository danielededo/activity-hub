# Serves the built app and proxies the API on the same origin, so the browser
# never makes a cross-origin request and CORS stays out of the picture.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads go through here: keep this above the API's own limit so the
    # request reaches FastAPI and gets a JSON 413 rather than an nginx page.
    # That limit is the largest thing any route accepts — an export archive,
    # MAX_ARCHIVE_BYTES (200 MiB) plus 1 MiB of framing — not a single file.
    # test_uploads.py fails if the two drift apart.
    client_max_body_size 210m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A long upload of a big TCX should not be cut off mid-parse.
        proxy_read_timeout 120s;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers loading a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
