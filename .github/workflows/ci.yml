name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Checked in CI because it was not: six files had drifted out of format
      # while `ruff check` stayed green, and every branch that ran the formatter
      # picked up unrelated churn it then had to revert.
      - name: Format
        run: ruff format --check .

      # The floor is enforced rather than advertised: a number in the README
      # goes stale the first time somebody adds a module and forgets, and a
      # badge only reports what already happened. Actual coverage is 96%, so
      # 90 leaves headroom for a change to be in progress without blocking it.
      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: activity
          POSTGRES_PASSWORD: activity
          POSTGRES_DB: activity_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activity -d activity_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://activity:activity@localhost:5432/activity_hub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check the migrations match the models
        # Fails if a model changed without a matching revision.
        run: alembic check

      - name: Check the downgrade path
        run: alembic downgrade base

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose:
    # Also the image build check: `--build` builds both Dockerfiles, and the
    # stack then runs them, which is strictly more than building them alone.
    name: Images and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: The API migrated itself and reports healthy
        # The image's own command migrates and then serves. A 503 here would
        # mean it came up without a schema; asserted explicitly so a failure
        # says which half broke rather than just "unhealthy".
        run: |
          curl -fsS http://localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: The dashboard is served
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"

      - name: The dashboard proxies the API on its own origin
        # Same-origin is the whole reason CORS never comes into it, so prove it
        # through the web container rather than against the API directly.
        run: |
          status=$(curl -sS -o /tmp/me.json -w '%{http_code}' http://localhost:8080/api/users/me)
          test "$status" = "404" || { echo "expected 404 before a profile, got $status"; cat /tmp/me.json; exit 1; }

      - name: Create the profile and upload an activity
        run: |
          curl -sS -f -X POST http://localhost:8080/api/users/ \
            -H 'Content-Type: application/json' \
            -d '{"first_name":"CI","last_name":"Runner"}' > /dev/null
          curl -sS -f -F "file=@demo/activities/2026-06-13-cycling.gpx" \
            "http://localhost:8080/api/upload?user_id=1" > /dev/null

      - name: The activity comes back through the stack
        run: |
          curl -sS -f http://localhost:8080/api/analysis/1 > /tmp/analysis.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/analysis.json'))
          assert d['workout_count'] == 1, d
          assert d['total_distance'] > 0, d
          print('stack round trip ok:', d['workout_count'], 'activity,', round(d['total_distance']/1000, 1), 'km')
          "

      - name: Logs
        if: failure()
        run: docker compose logs --tail 80

      - name: Stop
        if: always()
        run: docker compose down -v
